version: '3.8'

services:
  #######################################
  # 1. LiteLLM Proxy
  #######################################
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: llm-stack_litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml.template:/app/config.yaml.template
      - ./entrypoint-litellm.sh:/entrypoint-litellm.sh
    environment:
      - LANGFUSE_HOST=http://langfuse-server:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LITELLM_CONFIG_PATH=/app/config.yaml
      - LITELLM_LOG=DEBUG
      - OPENAI_API_KEY=EMPTY
      - VLLM_API_BASE=${VLLM_API_BASE}
    entrypoint: ["/bin/sh", "/entrypoint-litellm.sh"]

  #######################################
  # 2. Langfuse-DB
  #######################################
  langfuse-db:
    image: postgres:15
    container_name: llm-stack_langfuse-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  #######################################
  # 3. Langfuse-ClickHouse
  #######################################
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    container_name: llm-stack_langfuse-clickhouse
    restart: always
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - ${PWD}/clickhouse_config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    ports:
      - "8123:8123"
      - "9111:9000"

  #######################################
  # 4. Langfuse Server
  #######################################
  langfuse-server:
    image: ghcr.io/langfuse/langfuse:2
    container_name: llm-stack_langfuse-server
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@langfuse-db:5432/${POSTGRES_DB}
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - CLICKHOUSE_MIGRATION_URL=clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@langfuse-clickhouse:9000/default
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SALT=${SALT}
      - TELEMETRY_ENABLED=true
      - LANGFUSE_LOG_LEVEL=debug
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_started
    restart: on-failure

  #######################################
  # 5. Prometheus
  #######################################
  prometheus:
    image: prom/prometheus:latest
    container_name: llm-stack_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml.template:/etc/prometheus/prometheus.yml.template
      - ./entrypoint-prometheus.sh:/entrypoint-prometheus.sh
      - prometheus-data:/prometheus
    environment:
      - VLLM_METRICS_TARGET=${VLLM_METRICS_TARGET}
    entrypoint: ["/bin/sh", "/entrypoint-prometheus.sh"]

  #######################################
  # 6. Grafana
  #######################################
  grafana:
    image: grafana/grafana:latest
    container_name: llm-stack_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  #######################################
  # 7. OpenWebUI
  #######################################
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: llm-stack_openwebui
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_BASE=http://litellm:4000/v1
      - OPENAI_API_KEY=sk-test
      - OPENAI_API_MODEL=qwen-vl
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - litellm

  #######################################
  # 8. Discord Bot
  #######################################
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: llm-stack_discord-bot
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - OPENAI_API_BASE=http://litellm:4000/v1
      - OPENAI_API_KEY=sk-test
      - MODEL_NAME=qwen-vl
      - WEB_VIEWER_URL=${WEB_VIEWER_URL}
      - SHOW_THOUGHT_PROCESS=${SHOW_THOUGHT_PROCESS}
      - TARGET_CONFERENCES=${TARGET_CONFERENCES}
      - CCF_CATEGORIES=${CCF_CATEGORIES}
    volumes:
      - ./reports:/app/reports
    depends_on:
      - litellm
      - web-viewer
    restart: unless-stopped

  #######################################
  # 9. Web Viewer for Reports
  #######################################
  web-viewer:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: llm-stack_web-viewer
    command: ["python", "web_viewer.py"]
    ports:
      - "5050:5050"
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped

volumes:
  langfuse-db-data:
  langfuse-clickhouse-data:
  prometheus-data:
  grafana-data:
  open-webui-data:
